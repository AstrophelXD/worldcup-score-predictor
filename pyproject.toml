[project]
name = "worldcup-predictor"
version = "0.1.0"
description = "FIFA World Cup match score prediction system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10",
    "fastapi>=0.110",
    "hydra-core>=1.3",
    "numpy>=1.26",
    "omegaconf>=2.3",
    "pandas>=2.1",
    "pydantic>=2.6",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "scipy>=1.12",
    "torch>=2.2",
    "streamlit>=1.32",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
