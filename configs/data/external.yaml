defaults:
  - default

external_dir: ${project.root}/data/external
staging_dir: ${project.root}/data/staging
downloads_dir: ${data.external_dir}/downloads
include_samples: false

# Run once:
#   python -m scripts.export_external_seeds
#   python -m scripts.bootstrap_external_downloads
external_inputs:
  matches:
    - path: ${data.downloads_dir}/international_matches_canonical.csv
      format: canonical
    - path: ${data.downloads_dir}/wc_matches.csv
      format: canonical
  elo:
    - path: ${data.downloads_dir}/elo_from_results.csv
      format: canonical
    - path: ${data.downloads_dir}/elo_snapshot.csv
      format: canonical
  fifa_rankings:
    - path: ${data.downloads_dir}/fifa_rankings_canonical.csv
      format: canonical
  players:
    - path: ${data.downloads_dir}/players.csv
      format: canonical
  lineups:
    - path: ${data.downloads_dir}/lineups.csv
      format: canonical
  player_match_stats:
    - path: ${data.downloads_dir}/player_match_stats.csv
      format: canonical
  injuries:
    - path: ${data.downloads_dir}/injuries.csv
      format: canonical
  odds:
    - path: ${data.downloads_dir}/odds.csv
      format: canonical
    # Optional third-party historical odds (football-data.co.uk):
    # - path: ${data.downloads_dir}/football_data_odds.csv
    #   format: football_data_odds

sources:
  matches: ${data.staging_dir}/canonical/matches.csv
  elo: ${data.staging_dir}/canonical/elo.csv
  fifa_rankings: ${data.staging_dir}/canonical/fifa_rankings.csv
  players: ${data.staging_dir}/canonical/players.csv
  lineups: ${data.staging_dir}/canonical/lineups.csv
  player_match_stats: ${data.staging_dir}/canonical/player_match_stats.csv
  injuries: ${data.staging_dir}/canonical/injuries.csv
  odds: ${data.staging_dir}/canonical/odds.csv

source_systems:
  matches: external_prepared_csv
  elo: external_prepared_csv
  fifa_rankings: external_prepared_csv
  players: external_prepared_csv
  lineups: external_prepared_csv
  player_match_stats: external_prepared_csv
  injuries: external_prepared_csv
  odds: external_prepared_csv
