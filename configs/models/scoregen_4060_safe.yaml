defaults:
  - scoregen

# RTX 4060 (8GB) — safest smoke / debug profile (~3M params)
name: scoregen_football
version: v2_4060_safe

d_model: 64
n_heads: 4
n_layers: 2
n_components: 1

seq_len: 5
player_slots: 11

dropout: 0.15
batch_size: 4
grad_accum_steps: 8

learning_rate: 0.0003
weight_decay: 0.01
epochs: 200
patience: 25

gradient_checkpointing: true
torch_compile: false
num_workers: 2
pin_memory: true

odds_path: ${project.root}/data/samples/odds.csv
